# Host nginx vhost for the demo box (demo.itmseg.cloud).
#
# This is a MIRROR of /etc/nginx/conf.d/itmseg-demo.conf on that server, kept
# here so the config is reviewable and diffable. Nothing deploys it: the demo
# box terminates TLS on its own system nginx (not a container), so this file is
# documentation plus a source to copy from. After changing it:
#
#   scp docker/nginx-demo-host.conf root@demo:/etc/nginx/conf.d/itmseg-demo.conf
#   ssh root@demo 'nginx -t && systemctl reload nginx'
#
# Not to be confused with docker/nginx.conf, which is the containerised nginx
# for docker-compose.prod.yml — a different deployment shape (no TLS here, an
# `app:3000` upstream instead of a port on the host).
#
# The certbot-managed lines are reproduced as they appear on the server; certbot
# rewrites them in place, so re-check this mirror after a certificate change.

server {
    server_name demo.itmseg.cloud;

    client_max_body_size 50M;

    # Serve uploaded files directly — bypasses Next.js
    location /uploads/ {
        alias /opt/itmseg-demo/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options nosniff;
        # These bytes came from a user and nginx serves them from our own
        # origin, bypassing Next.js — so the app's CSP in next.config.ts never
        # applies here. Neutralise active content at the point of delivery.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox";
        add_header X-Frame-Options DENY;
        try_files $uri =404;
    }

    # Next.js monorepo handles all routes including /api/*
    location / {
        proxy_pass         http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/demo.itmseg.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/demo.itmseg.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = demo.itmseg.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name demo.itmseg.cloud;
    return 404; # managed by Certbot


}
