<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#660066">
<title>Offline · iTourTMS</title>
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --ink: #18181b; --muted: #52525b; --brand: #660066; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17141a; --ink: #f4f4f5; --muted: #a1a1aa; --brand: #b366b3; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 16px; }
  main { max-width: 26rem; text-align: center; }
  img { width: 56px; height: 56px; }
  h1 { font-size: 1.25rem; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  p[lang="ar"] { margin-top: -12px; }
  button { background: var(--brand); color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>iTourTMS needs a connection to load this page. Check your network and try again.</p>
  <p lang="ar" dir="rtl">أنت غير متصل بالإنترنت. تحقق من الاتصال وحاول مرة أخرى.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
